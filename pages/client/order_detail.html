<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flower Shop</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="../../css/client/style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="../../css/client/profile.css">
  </head>
<style>
        .order-header { border-left: 5px solid #0d6efd; }
        .badge-processing { background: #fff3cd; color: #856404; }
        .badge-delivering { background: #d1ecf1; color: #0c5460; }
        .badge-delivered  { background: #d4edda; color: #155724; }
        .badge-cancelled  { background: #f8d7da; color: #721c24; }
        .product-img { width: 80px; height: 80px; object-fit: cover; }
        .border-start-primary { border-left: 4px solid #0d6efd; }
    </style>

  <body>
    <div id="loadingOverlay" class="justify-content-center align-items-center">
        <div class="spinner-border text-light" role="status" style="width: 3rem; height: 3rem;">
            <span class="visually-hidden"></span>
        </div>
    </div>
    <div id="header"></div>
    <main>
        <div class="container py-5">
    <!-- Nút quay lại -->
    <a href="order.html" class="btn btn-outline-secondary mb-4">
        <i class="bi bi-arrow-left"></i> Quay lại danh sách đơn hàng
    </a>

    <div class="row">
        <div class="col-lg-8 mx-auto">
            <div id="order-detail">
                            
            </div>


            <!-- Danh sách sản phẩm -->
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-white fw-bold">
                    <i class="bi bi-basket3"></i> Sản phẩm trong đơn hàng
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <tbody id="order-items">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
    </main>
    <div id="footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="module" src="../../js/client/order_detail.js"></script>
    <script src="../../components/footer.js"></script>
    <script src="../../components/header.js"></script>
  </body>
</html>
