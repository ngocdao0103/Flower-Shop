<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tổng quan - Flower Admin</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/admin/style.css" />

    <!-- Chặn nếu chưa có tài khoản admin -->
  </head>

  <body class="bg-light">
    <div id="headerAdmin"></div>
    <div class="row w-100">
      <div class="col-2 p-0 border-end bg-white">
        <div id="navbar"></div>
      </div>
      <div class="col-10 p-4">
        <h3 class="fw-semibold mb-4">
          <i class="bi bi-speedometer2 me-2 text-primary"></i>Tổng quan hệ thống
        </h3>

        <div class="row g-3 mb-4">
          <div class="col-md-3">
            <div class="card shadow-sm border-0">
              <div class="card-body text-center">
                <h5 class="fw-bold" id="countUsers">0</h5>
                <p class="text-muted mb-0">
                  <i class="bi bi-person-fill text-primary me-1"></i>Người dùng
                </p>
              </div>
            </div>
          </div>
          <div class="col-md-3">
            <div class="card shadow-sm border-0">
              <div class="card-body text-center">
                <h5 class="fw-bold" id="countOrders">0</h5>
                <p class="text-muted mb-0">
                  <i class="bi bi-bag-fill text-success me-1"></i>Đơn hàng
                </p>
              </div>
            </div>
          </div>
          <div class="col-md-3">
            <div class="card shadow-sm border-0">
              <div class="card-body text-center">
                <h5 class="fw-bold" id="countProducts">87</h5>
                <p class="text-muted mb-0">
                  <i class="bi bi-box-seam-fill text-warning me-1"></i>Sản phẩm
                </p>
              </div>
            </div>
          </div>
          <div class="col-md-3">
            <div class="card shadow-sm border-0">
              <div class="card-body text-center">
                <h5 class="fw-bold" id="countCategories">0</h5>
                <p class="text-muted mb-0">
                  <i class="bi bi-tags-fill text-danger me-1"></i>Danh mục
                </p>
              </div>
            </div>
          </div>
        </div>

        <ul class="nav nav-pills justify-content-center">
          <li class="nav-item">
            <a
              class="nav-link active"
              id="order_tab"
              data-chart="order"
              href="#"
              >Đơn Hàng</a
            >
          </li>
          <li class="nav-item">
            <a class="nav-link" id="total_tab" data-chart="total" href="#"
              >Tổng tiền</a
            >
          </li>
        </ul>

        <div class="row mb-3 ">
          <div class="col-md-3">
            <label>Từ ngày</label>
            <input type="date" id="startDate" class="form-control" />
          </div>
          <div class="col-md-3">
            <label>Đến ngày</label>
            <input type="date" id="endDate" class="form-control" />
          </div>
          <div class="col-md-3 d-flex align-items-end gap-3">
            <button id="cancel" class="btn btn-danger">Hủy</button>
            <button id="filterDateBtn" class="btn btn-primary">Lọc</button>
          </div>
        </div>

        <div class="chart-container d-none" data-chart="dayFilter">
          <canvas id="filteredChart"></canvas>
        </div>

        <div
          class="card shadow-sm border-0 chart-container"
          id="order-chart-container"
          data-chart="order"
        >
          <div class="card-body">
            <h5 class="mb-3 fw-semibold">📈 Biểu đồ doanh thu</h5>
            <canvas id="revenueChart" height="120"></canvas>
          </div>
        </div>

        <div
          class="card shadow-sm border-0 chart-container d-none"
          id="total-chart-container"
          data-chart="total"
        >
          <div class="card-body">
            <h5 class="mb-3 fw-semibold">📈 Biểu đồ doanh thu</h5>
            <canvas id="totalRevenueChart" height="120"></canvas>
          </div>
        </div>
      </div>
    </div>

    <script src="../../../components/admin/header.js"></script>
    <script src="../../../components/admin/navbar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module" src="../../../js/admin/dashboarh.js"></script>
  </body>
</html>
